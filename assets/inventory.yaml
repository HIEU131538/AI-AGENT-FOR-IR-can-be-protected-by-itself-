# assets/inventory.yaml — Kiểm kê tài sản lab AegisSOC (Ngày 2)
#
# Trả lời câu analyst hỏi: "Máy này là máy gì, quan trọng cỡ nào?"
# Node làm giàu (agent/nodes/enricher.py) tra file này — TẤT ĐỊNH, không dùng LLM.
# Sửa file là hệ thống đổi theo ngay ở alert kế tiếp, không cần khởi động lại.
#
# Trường:
#   ip                  IP của máy (bỏ trống nếu chỉ tra theo tên máy)
#   name                tên máy — trùng với trường `host` của alert endpoint (Sysmon)
#   role                vai trò: web_server | it_scanner | workstation | ...
#   criticality         low | medium | high | critical
#   auto_block_allowed  SOAR có được TỰ chặn khi máy này liên quan không (Responder dùng ở Ngày 4)
#   note                ghi chú (TIẾNG ANH — được đưa vào prompt của Llama, B4.3f)

assets:
  - ip: 192.168.56.20
    name: web-win-01
    role: web_server
    criticality: high
    auto_block_allowed: false     # máy thiết yếu: SOAR không được tự chặn
    note: "Lab Windows/IIS web server hosting the public web application"   # B4.3c: bỏ chữ "đích của chuỗi tấn công" — ghi chú này được đưa vào prompt

  - ip: 192.168.56.30
    name: it-scanner-01
    role: it_scanner              # máy quét hợp lệ của IT — dùng cho màn 2
    criticality: low
    auto_block_allowed: false
    note: "IT vulnerability scanner - scheduled port and service scans from this host are legitimate"

  # B4.3c: bộ cân bằng tải + giám sát — gửi health check và dò dịch vụ định kỳ
  - ip: 192.168.56.5
    name: lb-monitor-01
    role: load_balancer_monitoring
    criticality: medium
    auto_block_allowed: false
    note: "Load balancer and monitoring - periodic /health requests and service port checks from this host are legitimate"

  # ===== Lab thật (topology bạn Splunk, 04/10) — dùng cho DEMO. Dải 192.168.56.x ở trên giữ nguyên cho benchmark. =====
  # Máy web = Kali chạy Nginx (proxy01) + Suricata (sensor-net-01), CÓ 2 CARD MẠNG:
  #   192.168.10.135  mạng lab (không ra Internet)
  #   192.168.46.166  card ra Internet (NAT) — C01 "Large Outbound Transfer From Web Server" sinh từ card này
  # Khai CẢ HAI IP cùng tên `proxy01` → Correlator coi là MỘT thực thể (asset:proxy01), nên
  # B01–B04 (đích .135) và C01 (nguồn .166) nối được thành một chuỗi.
  - ip: 192.168.10.135
    name: proxy01
    role: web_server
    criticality: high
    auto_block_allowed: false     # máy thiết yếu: SOAR không được tự chặn
    note: "Lab Linux web server (Nginx) hosting the web application - lab network interface"

  - ip: 192.168.46.166
    name: proxy01
    role: web_server
    criticality: high
    auto_block_allowed: false
    note: "Lab Linux web server (Nginx) hosting the web application - Internet-facing NAT interface"

  # Máy Windows (Sysmon + UF) chạy ứng dụng web qua XAMPP — máy nạn nhân của kịch bản demo 1 (B05–B07, B12, B17, B21).
  # Alert endpoint có host = DESKTOP-6FBL9UV → khớp theo tên.
  - ip: 192.168.10.128
    name: DESKTOP-6FBL9UV
    role: web_server
    criticality: high
    auto_block_allowed: false     # máy chủ ứng dụng: SOAR không tự cách ly, phải chờ người duyệt
    note: "Lab Windows 10 host running the XAMPP (Apache/PHP) web application"

# B4.3c: tài khoản — tra theo trường User của alert endpoint (Sysmon). Không phân biệt hoa thường.
# Trường:
#   name   tài khoản dạng DOMAIN\user (khớp cả khi alert chỉ ghi phần user)
#   role   admin | service_account | user
#   note   hoạt động bình thường của tài khoản này
accounts:
  - name: DOMAIN\admin
    role: admin
    note: "System administrator - uses admin tools (whoami, PsExec, PowerShell) during business hours"

  - name: DOMAIN\backup
    role: service_account
    note: "Backup service account - runs backup scripts and creates nightly scheduled tasks, never logs on interactively"
